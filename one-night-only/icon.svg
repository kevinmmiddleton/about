<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Rated O">
  <title>Rated O</title>
  <!-- The Stamp form from identity.html: ring at 62% of the height, its border
       24% of its own diameter. The plate carries its own ground, so this needs
       no dark-mode variant. The stamp's rule is dropped deliberately: at 16px
       max(2px, H*.021) is a third of a pixel and renders as grey fuzz. -->
  <rect width="180" height="180" fill="#14432F"/>
  <circle cx="90" cy="90" r="42.408" fill="none" stroke="#FFFFFF" stroke-width="26.784"/>
</svg>
