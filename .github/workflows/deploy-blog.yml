name: Publish blog

# Builds /blog/ from markdown in blog/_posts/ (authored via Sveltia CMS at
# /admin). A push that changes a post or the generator triggers a rebuild; the
# generated HTML is committed back (push to main -> GitHub Pages deploys).
# No secrets needed. Triggers:
#   - push to main touching posts/generator (the normal publish path)
#   - workflow_dispatch: run manually from the Actions tab
#   - schedule: daily, and this one is LOAD-BEARING, not a safety net.
#     status=published with a future published_at is held back by the generator
#     until that date arrives in New York. This run is what puts it live, so
#     removing it silently strands every scheduled post.
#
#     09:00 UTC is 05:00 EDT and 04:00 EST, both the same calendar day as the
#     UTC date, so a post dated the 8th goes out on the morning of the 8th in
#     New York under either offset. GitHub's cron does not observe DST, which
#     is why the hour has to work for both.
on:
  push:
    branches: [main]
    paths:
      - 'blog/_posts/**'
      - 'blog/images/**'
      - 'tools/blog-generate.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Build /blog from markdown
        run: node tools/blog-generate.mjs
      - name: Commit & push if the output changed
        run: |
          git config user.name "blog-bot"
          git config user.email "noreply@middleton.io"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto-build blog from markdown"
            git push
            echo "Published changes."
          else
            echo "No changes to publish."
          fi
