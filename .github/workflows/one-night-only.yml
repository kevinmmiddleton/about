name: Publish One Night Only

# Collects NYC one-night-only film screenings and rebuilds /one-night-only/
# (site, RSS feed, and subscribable calendar). Generated files are committed
# back; push to main means GitHub Pages deploys. No secrets needed.
#
# Twice daily. Venues announce and cancel on their own schedule and a stale
# calendar sends someone across the city for nothing, so a day-old feed is the
# thing to avoid. More often than this would add crawl load on ~90 third-party
# hosts for listings that rarely change intraday.
#
# 05:20 UTC, not 07:20. The page leads with TODAY in New York, so the overnight
# run needs to land as soon after New York midnight as possible: 05:20 UTC is
# 01:20 EDT and 00:20 EST, the first UTC hour that is past midnight in both
# offsets. GitHub's cron does not observe DST, which is why the hour has to work
# for both. This shrinks, but cannot close, the window in which a static page
# still believes yesterday is today; the page script closes the rest.
# Both times are off-peak in New York and deliberately not on the hour, which is
# when every other scheduled job in the world runs.
#
# The build is byte-stable, so a run that finds nothing new produces no commit.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 5,19 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/one-night-only/**'
      - '.github/workflows/one-night-only.yml'

permissions:
  contents: write
  # notify-stale.mjs opens (and later closes) an issue when the collector has
  # been refusing to publish for more than a day.
  issues: write

concurrency:
  group: publish-one-night-only
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Full history: the commit step rebases before pushing, and a rebase on
      # a depth-1 checkout has nothing to rebase onto.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Zero npm dependencies on purpose, so there is nothing to install and
      # nothing to audit. If a source needs a parser, write the parser.

      # Fails the run rather than publishing an empty day. A source that
      # collapses to zero where it previously had many trips the guard inside
      # collect.mjs, which exits non-zero and writes nothing.
      - name: Collect screenings
        run: node tools/one-night-only/collect/collect.mjs

      - name: Build site, feed and calendar
        run: node tools/one-night-only/build.mjs

      # The gate. Real ICS parsers silently accept structural corruption, so
      # this is a hand-written linter: CRLF, 75-octet folding, BEGIN/END
      # matching, and UID uniqueness. A duplicate UID is what gives every
      # subscriber a doubled event, so it fails the build rather than warns.
      - name: Validate the calendar
        run: node tools/one-night-only/lint-ics.mjs one-night-only/calendar.ics

      - name: Commit & push if the output changed
        run: |
          git config user.name "one-night-only-bot"
          git config user.email "noreply@middleton.io"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to publish."
            exit 0
          fi
          git add -A
          git commit -m "Auto-build One Night Only listings"
          # Kevin publishes blog posts through Sveltia, which commits to main.
          # A commit landing during this run would make a bare push fail and
          # turn the run red for a reason that has nothing to do with the
          # listings. Rebase and retry; only a real conflict fails.
          for attempt in 1 2 3; do
            if git push; then
              echo "Published changes."
              exit 0
            fi
            echo "Push rejected (attempt $attempt). Rebasing onto origin/main."
            git pull --rebase origin main || exit 1
          done
          echo "Could not push after 3 attempts."
          exit 1

      # THE ALARM. A red run in the Actions tab is not a notification: the
      # collector refused for fifteen days in August 2026 and nobody noticed
      # until the site was visibly a fortnight stale. This opens an issue, but
      # only after a streak of failures spanning more than a day, so a single
      # transient upstream hiccup stays silent.
      #
      # Last in the job and if: failure(), so it covers every step above it
      # (collect, build, lint, push) rather than only the ones before it. It
      # never fails itself; the run is already red for the real reason.
      - name: Say something if this has been failing for more than a day
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/one-night-only/notify-stale.mjs

      # Clear the alarm. An alert that has to be closed by hand is an alert
      # that stays open and stops meaning anything.
      - name: Close the stale-collector issue if one is open
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/one-night-only/notify-stale.mjs --resolved
