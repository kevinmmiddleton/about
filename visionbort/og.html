<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Source for og-image.png (1280x720). Render this page at 1280x720 and
       screenshot it. og-wall.jpg is the example show, exported from the app
       with the wall-only format. -->
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;600&family=Host+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --stock: #f4f1ea;
      --ink: #1c1b19;
      --ink-2: #47453f;
      --dot: #c4122f;
      --room: #d9d5cd;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1280px; height: 720px; overflow: hidden;
      background: var(--stock);
      color: var(--ink);
      font-family: 'Host Grotesk', system-ui, sans-serif;
      display: grid; grid-template-columns: 470px 1fr;
    }
    .copy { padding: 76px 0 64px 72px; display: flex; flex-direction: column; }
    .kicker { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
    .kicker i { width: 16px; height: 16px; border-radius: 50%; background: var(--dot); }
    h1 { margin-top: 36px; font-family: 'Funnel Display', sans-serif; font-weight: 600; font-size: 74px; line-height: 0.98; letter-spacing: -0.03em; }
    p { margin-top: 28px; font-size: 24px; line-height: 1.4; color: var(--ink-2); max-width: 360px; }
    .url { margin-top: auto; font-size: 20px; font-weight: 500; color: var(--ink-2); }
    .room { background: var(--room); display: grid; place-items: center; padding-right: 8px; }
    .room img { width: 760px; height: auto; display: block; box-shadow: 0 2px 4px rgba(0,0,0,.18), 0 30px 70px rgba(0,0,0,.3); transform: translateX(-24px); }
  </style>
</head>
<body>
  <div class="copy">
    <span class="kicker"><i></i>Visionbort</span>
    <h1>Hang the year you want.</h1>
    <p>Photos, cutouts, and words on a gallery wall. A label for why each piece matters, and a red dot when it comes true.</p>
    <span class="url">middleton.io/visionbort</span>
  </div>
  <div class="room"><img src="og-wall.jpg" alt=""></div>
</body>
</html>
