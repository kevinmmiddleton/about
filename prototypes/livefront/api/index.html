<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Carton Caps API reference · Kevin Middleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script async src="https://plausible.io/js/pa-CycHtdoRKtjDMtDpjBTA4.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init({hashBasedRouting:true})
</script>
<style>
  :root{
    --navy:#244459; --ink:#0e1b24; --text:#374952; --muted:#66747a;
    --blue:#0077c1; --light-blue:#e3f5ff; --bg:#f9fafb; --white:#fff; --border:#e1e4e5; --pill:#eff0f1;
    --code-bg:#13222d; --code-head:#1a2d3a; --code-text:#d6e2ea; --code-muted:#7f97a8; --code-border:#24394a;
    --get:#0a7c4a; --get-bg:#e3f6ec; --post:#0068a8; --post-bg:#e3f1fb; --undef:#8a5a00; --undef-bg:#fff4dc;
    --serif:"Source Serif 4",Georgia,serif;
    --sans:Onest,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --top:58px;
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:calc(var(--top) + 12px)}
  html,body{margin:0}
  body{background:var(--white);color:var(--text);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
  body.locked{overflow:hidden}
  button,input{font:inherit}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  code{font-family:var(--mono);font-size:.88em;background:var(--pill);border-radius:5px;padding:1px 5px;color:var(--ink)}

  /* gate */
  .gate{position:fixed;inset:0;z-index:50;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:24px}
  .gate[hidden]{display:none}
  .gatecard{width:100%;max-width:380px;text-align:center;color:#fff}
  .gatecard h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.2;letter-spacing:-.5px;margin:0 0 6px}
  .gatecard .by{color:#c7d3dc;font-size:14px;margin-bottom:28px}
  .gaterow{display:flex;gap:8px}
  .gaterow input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);color:#fff;border-radius:999px;padding:12px 18px;outline:none}
  .gaterow input::placeholder{color:#a9b8c3}
  .gaterow input:focus{border-color:#a1dcfc}
  .gaterow button{border:0;background:#fff;color:var(--navy);border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer}
  .gaterow button:disabled{opacity:.6}
  .miss{min-height:22px;margin-top:14px;font-size:14px;color:#a1dcfc}

  /* top bar */
  .top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:20;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px}
  .brand{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:17px;letter-spacing:-.2px;white-space:nowrap}
  .ver{font:600 11.5px/1 var(--mono);color:var(--muted);background:var(--pill);border-radius:999px;padding:5px 9px}
  .top .sp{flex:1}
  .back{font-size:14px;color:var(--muted);white-space:nowrap}
  .menu{display:none;border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--navy)}

  /* sidebar */
  .side{position:fixed;top:var(--top);bottom:0;left:0;width:264px;border-right:1px solid var(--border);background:var(--bg);overflow-y:auto;padding:18px 14px 40px;z-index:15}
  .search{position:relative;margin-bottom:14px}
  .search input{width:100%;border:1px solid var(--border);border-radius:9px;padding:8px 12px 8px 32px;background:#fff;outline:none;font-size:14px;color:var(--ink)}
  .search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--light-blue)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 6px;background:var(--bg)}
  .ng{margin-bottom:16px}
  .ngt{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px}
  .nl{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:var(--text);font-size:14px;line-height:1.35}
  .nl:hover{background:var(--pill);text-decoration:none}
  .nl.on{background:var(--light-blue);color:var(--navy);font-weight:600}
  .nl[hidden]{display:none}
  .np{font-family:var(--mono);font-size:13px}
  .none-found{font-size:13.5px;color:var(--muted);padding:6px 10px}

  /* method pills */
  .m{display:inline-block;font:700 11px/1 var(--mono);letter-spacing:.04em;border-radius:5px;padding:4px 6px;min-width:42px;text-align:center}
  .m.sm{font-size:9.5px;padding:3px 4px;min-width:36px}
  .m-get{color:var(--get);background:var(--get-bg)}
  .m-post{color:var(--post);background:var(--post-bg)}
  .m-undef{color:var(--undef);background:var(--undef-bg);border:1px dashed #d9a640}

  /* main */
  main{margin-left:264px;padding-top:var(--top)}
  .sec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;padding:52px 48px;border-bottom:1px solid var(--border);max-width:1400px}
  .col-code{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(var(--top) + 24px);align-self:start;max-height:calc(100vh - var(--top) - 48px);overflow:auto;scrollbar-width:thin}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 6px}
  h1{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:clamp(28px,3vw,38px);line-height:1.15;letter-spacing:-.6px;margin:0 0 12px}
  h2{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:26px;line-height:1.2;letter-spacing:-.4px;margin:0 0 14px}
  h2.mono{font-family:var(--mono);font-size:22px;letter-spacing:0}
  h3{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);margin:30px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  h3 .ct{font:500 12px var(--mono);text-transform:none;letter-spacing:0;color:var(--muted);margin-left:6px}
  .lede{font-size:17px;color:var(--ink)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
  .stats div{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--bg)}
  .stats b{display:block;color:var(--navy);font-size:17px}
  .stats span{font-size:12.5px;color:var(--muted)}
  @media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}

  .route{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:9px 10px 9px 12px;background:var(--bg);margin:4px 0 14px}
  .route code{background:none;padding:0;font-size:14.5px;font-weight:600;flex:1}
  .undef-path{flex:1;font-size:14px;font-style:italic;color:var(--muted)}
  .copy{border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:6px;font-size:12px;padding:3px 9px;cursor:pointer}
  .copy:hover{color:var(--navy);border-color:#c5ccd0}
  .copy.ok{color:var(--get);border-color:#a8dcc0}

  .used{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .used-l{font-size:12.5px;color:var(--muted);margin-right:2px}
  .chip{font-size:12.5px;font-weight:600;color:var(--navy);background:var(--light-blue);border-radius:999px;padding:3px 10px}
  .chip:hover{text-decoration:none;background:#cfecfd}
  .chip.muted{background:var(--pill);color:var(--muted);font-weight:500}

  .fields{border-top:0}
  .field{padding:13px 0;border-bottom:1px solid var(--border)}
  .field:last-child{border-bottom:0}
  .fhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}
  .fname{background:none;padding:0;font-weight:700;font-size:14px;color:var(--ink)}
  .ftype{font-size:13px;color:var(--muted)}
  .tfmt{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tref{font-family:var(--mono);font-size:12.5px;font-weight:600}
  .req{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#b4472d}
  .opt{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#9aa5ab}
  .fdesc{margin:4px 0 0;font-size:14.5px}
  .fdesc.none{color:#9aa5ab;font-style:italic}
  .fextra{margin:4px 0 0;font-size:13px;color:var(--muted)}
  .schema-link{margin:10px 0 0;font-size:14px;color:var(--muted)}
  details.child{margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:0 14px}
  details.child>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:8px 0;list-style:none}
  details.child>summary::before{content:"+ ";font-family:var(--mono)}
  details.child[open]>summary::before{content:"− "}
  details.child[open]>summary{border-bottom:1px solid var(--border)}
  details.resp{border:1px solid var(--border);border-radius:10px;margin-top:10px;padding:0 14px}
  details.resp>summary{cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 0;list-style:none;font-size:14.5px;color:var(--ink)}
  details.resp>summary::-webkit-details-marker,details.child>summary::-webkit-details-marker{display:none}
  details.resp>summary::after{content:"›";margin-left:auto;color:var(--muted);transition:transform .15s;font-size:18px}
  details.resp[open]>summary::after{transform:rotate(90deg)}
  details.resp[open]>summary{border-bottom:1px solid var(--border)}
  .sc{font:700 12px/1 var(--mono);border-radius:5px;padding:4px 7px}
  .sc-ok{color:var(--get);background:var(--get-bg)}
  .sc-err{color:#b4472d;background:#fdece7}

  .note{margin-top:28px;border:1px solid #cfe6f5;background:#f3f9fd;border-radius:12px;padding:14px 16px}
  .note-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--navy);margin-bottom:8px}
  .note-h .q{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;letter-spacing:0}
  .note ul{margin:0;padding-left:18px;font-size:14px}
  .note li+li{margin-top:6px}
  .note b{color:var(--ink)}
  .source{font-size:13px;color:var(--muted);margin:-4px 0 0}
  .source b{color:var(--text);font-weight:600}

  /* referral flow */
  .flow{list-style:none;margin:22px 0 0;padding:0;position:relative}
  .flow::before{content:"";position:absolute;left:15px;top:18px;bottom:18px;width:2px;background:var(--border)}
  .step{display:flex;gap:16px;position:relative;padding-bottom:22px}
  .step:last-child{padding-bottom:0}
  .step-n{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;background:var(--navy);box-shadow:0 0 0 4px #fff;position:relative}
  .step.friend .step-n{background:var(--blue)}
  .step-b{flex:1;min-width:0;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:#fff}
  .step-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
  .who{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--navy);margin-right:auto}
  .step.friend .who{color:var(--blue)}
  .step-t{font-weight:600;color:var(--ink);font-size:15.5px;margin-bottom:6px}
  .step-b p{margin:6px 0 0;font-size:14px}
  .call{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:4px 10px 4px 5px;background:var(--bg);color:var(--ink)}
  .call:hover{text-decoration:none;border-color:#c5ccd0}
  .call code{background:none;padding:0;font-weight:600;font-size:13px}
  .call .undef-path{flex:none;font-size:13px}
  .nocall{display:inline-block;font-size:13px;font-style:italic;color:var(--muted);border:1px dashed var(--border);border-radius:8px;padding:4px 10px}
  .step-f{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .step-f code{font-size:11.5px}
  .seq{padding:10px 8px}
  .seq-row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px}
  .seq-row+.seq-row{border-top:1px dashed var(--code-border)}
  .seq-n{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 11px var(--sans);background:#2a4253;color:#fff}
  .seq-row.friend .seq-n{background:#0a5f96}
  .seq-who{flex:none;width:58px;font-size:12px;color:var(--code-muted)}
  .seq .call{background:transparent;border:0;padding:0;color:var(--code-text)}
  .seq .call code{color:var(--code-text)}
  .seq .nocall{border-color:var(--code-border);color:var(--code-muted);padding:2px 8px}
  .seq .undef-path{color:#e9c27a}
  .seq .m-get{background:#123a2a;color:#7fe0aa}.seq .m-post{background:#10324a;color:#8ccfff}.seq .m-undef{background:#3a2c10;color:#f5c27a;border-color:#8a6a2a}
  blockquote{margin:12px 0;border-left:3px solid var(--blue);background:var(--bg);border-radius:0 10px 10px 0;padding:10px 14px;font-size:14.5px;color:var(--ink)}
  blockquote .src{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}

  /* code panels */
  .code{background:var(--code-bg);border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(14,27,36,.08);border:1px solid var(--code-border)}
  .code-h{display:flex;align-items:center;gap:8px;background:var(--code-head);padding:8px 10px 8px 14px;border-bottom:1px solid var(--code-border);font-size:12.5px;font-weight:600;color:var(--code-text);min-height:40px}
  .code-h>span{flex:1}
  .code-h .copy{background:transparent;border-color:var(--code-border);color:var(--code-muted)}
  .code-h .copy:hover{color:#fff}
  .tabs{display:flex;gap:4px}
  .tab{border:0;background:transparent;color:var(--code-muted);font:600 12px var(--mono);border-radius:6px;padding:4px 8px;cursor:pointer}
  .tab.on{background:#2a4253;color:#fff}
  .code pre{margin:0;padding:14px 16px;font:12.8px/1.6 var(--mono);color:var(--code-text);overflow:auto;max-height:440px;white-space:pre}
  .code pre.pane{display:none}
  .code pre.pane.on{display:block}
  .code .k{color:#8ccfff}.code .s{color:#a6e3b8}.code .n{color:#f5c27a}.code .b{color:#e9a3f5}.code .cm{color:var(--code-muted);font-style:italic}
  .code-f{font-size:11.5px;color:var(--code-muted);padding:8px 16px;border-top:1px solid var(--code-border)}
  .oplist{padding:8px}
  .oplist a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--code-text)}
  .oplist a:hover{background:#1c3140;text-decoration:none}
  .oplist code{background:none;color:var(--code-text);padding:0}
  .oplist .m-get{background:#123a2a;color:#7fe0aa}.oplist .m-post{background:#10324a;color:#8ccfff}

  .foot{padding:30px 48px 60px;color:var(--muted);font-size:13px;max-width:1400px}

  @media(max-width:1100px){.sec{grid-template-columns:1fr;gap:24px;padding:40px 32px}.col-code{position:static;max-height:none;overflow:visible}}
  @media(max-width:860px){
    .side{transform:translateX(-100%);transition:transform .2s;box-shadow:none}
    body.nav-open .side{transform:none;box-shadow:0 10px 40px rgba(14,27,36,.2)}
    main{margin-left:0}.menu{display:inline-block}
    .sec{padding:32px 18px}.foot{padding:24px 18px 50px}
    .back{display:none}
  }
</style>
</head>
<body class="locked">

<div class="gate" id="gate">
  <form class="gatecard" id="gateform" autocomplete="off">
    <h1>Carton Caps API</h1>
    <div class="by">Reference · Kevin Middleton</div>
    <div class="gaterow">
      <input id="pw" type="password" placeholder="Password" aria-label="Password" autofocus>
      <button id="go" type="submit">View</button>
    </div>
    <div class="miss" id="miss" role="status"></div>
  </form>
</div>

<header class="top" hidden id="top">
  <button class="menu" id="menu" aria-label="Open navigation">☰</button>
  <span class="brand">Carton Caps API</span>
  <span class="ver" id="ver"></span>
  <span class="sp"></span>
  <a class="back" href="../">← Referral stories</a>
</header>
<aside class="side" hidden id="side">
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search" aria-label="Search the reference">
    <kbd>/</kbd>
  </div>
  <div id="nav"></div>
  <div class="none-found" id="nf" hidden>No matches.</div>
</aside>

const track=(e,p)=>{try{plausible(e,p?{props:p}:undefined)}catch(_){}};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(PAYLOAD.s),iterations:PAYLOAD.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.i)},key,b64(PAYLOAD.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

function highlight(pre){
  if(pre.querySelector('.cm'))return;
  pre.innerHTML=pre.innerHTML
    .replace(/(&quot;[^&]*?&quot;)(\s*:)/g,'<span class="k">$1</span>$2')
    .replace(/(:\s*)(&quot;.*?&quot;)/g,'$1<span class="s">$2</span>')
    .replace(/(\[\s*)(&quot;.*?&quot;)/g,'$1<span class="s">$2</span>')
    .replace(/(:\s*)(-?\d+(?:\.\d+)?)(?=[,\n\s]|$)/g,'$1<span class="n">$2</span>')
    .replace(/(:\s*)(true|false|null)/g,'$1<span class="b">$2</span>')
    .replace(/^(curl)/,'<span class="b">$1</span>')
    .replace(/(-X|-H|-d)(\s)/g,'<span class="k">$1</span>$2');
}

function mount(d){
  document.getElementById('gate').hidden=true;
  document.body.classList.remove('locked');
  ['top','side','main'].forEach(id=>document.getElementById(id).hidden=false);
  document.getElementById('ver').textContent='v'+d.version;
  document.getElementById('nav').innerHTML=d.nav;
  const main=document.getElementById('main');
  main.innerHTML=d.main+'<div class="foot">Rendered from the client’s OpenAPI spec (<code>LivefrontPMChallenge--APIspec.txt</code>). Paths, fields, and status codes are unchanged. Example payloads are generated from schema types and are illustrative.</div>';
  main.querySelectorAll('.code pre').forEach(highlight);

  // tabs
  main.addEventListener('click',e=>{
    const t=e.target.closest('.tab');
    if(t){const box=t.closest('.code');box.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
      box.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===t.dataset.t));
      track('Livefront API Response Tab',{tab:t.dataset.t});return;}
    const c=e.target.closest('.copy');
    if(c){const txt=c.dataset.copyPre?c.closest('.code').querySelector('pre').innerText:c.dataset.copy;
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{}).finally(()=>{});
      const old=c.textContent;c.textContent='Copied';c.classList.add('ok');setTimeout(()=>{c.textContent=old;c.classList.remove('ok')},1400);
      track('Livefront API Copy',{section:c.closest('.sec').id});return;}
    const a=e.target.closest('a.chip');
    if(a)track('Livefront API Story Link',{to:a.getAttribute('href')});
  });

  // scrollspy + section views
  const links=[...document.querySelectorAll('.nl')];
  const byId=Object.fromEntries(links.map(l=>[l.dataset.s,l]));
  const seen=new Set();
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(!e.isIntersecting)return;
      const id=e.target.id; links.forEach(l=>l.classList.toggle('on',l.dataset.s===id));
      const l=byId[id]; if(l){const r=l.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-20)l.scrollIntoView({block:'nearest'})}
      if(!seen.has(id)){seen.add(id);track('Livefront API Section',{section:id});}
      if(history.replaceState)history.replaceState(null,'','#'+id);
    });
  },{rootMargin:'-70px 0px -65% 0px'});
  main.querySelectorAll('.sec').forEach(s=>io.observe(s));

  // nav click (mobile closes)
  document.getElementById('nav').addEventListener('click',e=>{if(e.target.closest('.nl'))document.body.classList.remove('nav-open')});
  document.getElementById('menu').addEventListener('click',()=>document.body.classList.toggle('nav-open'));

  // search
  const q=document.getElementById('q');
  const text=Object.fromEntries([...main.querySelectorAll('.sec')].map(s=>[s.id,(s.dataset.title+' '+s.querySelector('.col-text').textContent).toLowerCase()]));
  let searched=false;
  q.addEventListener('input',()=>{
    const v=q.value.trim().toLowerCase(); let any=false;
    links.forEach(l=>{const hit=!v||(l.textContent.toLowerCase().includes(v)||(text[l.dataset.s]||'').includes(v));l.hidden=!hit;any=any||hit});
    document.querySelectorAll('.ng').forEach(g=>g.hidden=![...g.querySelectorAll('.nl')].some(l=>!l.hidden));
    document.getElementById('nf').hidden=any;
    if(v&&!searched){searched=true;track('Livefront API Search');}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}
    if(e.key==='Escape'){q.value='';q.dispatchEvent(new Event('input'));q.blur();document.body.classList.remove('nav-open')}
  });

  if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)setTimeout(()=>t.scrollIntoView(),0)}
}

document.getElementById('gateform').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value, go=document.getElementById('go'), miss=document.getElementById('miss');
  go.disabled=true; miss.textContent='';
  try{ const d=await decrypt(pw); try{sessionStorage.setItem('lf-pw',pw)}catch(_){}
    track('Livefront API Login',{method:'password'}); mount(d);
  }catch(_){ miss.textContent='That password didn’t work.'; track('Livefront API Login Failed'); go.disabled=false; }
});
(async()=>{ let pw=null; try{pw=sessionStorage.getItem('lf-pw')}catch(_){}
  if(pw){ try{ const d=await decrypt(pw); track('Livefront API Login',{method:'returning session'}); mount(d); }catch(_){ try{sessionStorage.removeItem('lf-pw')}catch(__){} } } })();
</script>
